name: Build Orca Mobile APK

# Builds the Flutter Android app and publishes the APK as a GitHub Release.
# The in-app updater (lib/services/updater.dart) polls the "latest" release and
# offers the attached *.apk to users when its version is newer than theirs.
#
# Trigger by pushing a tag like `orca-v0.2.0`, or run manually from the Actions
# tab (manual runs build the APK as a workflow artifact without a release).

on:
  push:
    tags:
      - 'orca-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == orca-v* ]]; then
            VERSION="${REF#orca-v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/orca-mobile-${{ steps.version.outputs.version }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-mobile-apk
          path: orca-flutter/dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/orca-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Orca Mobile ${{ steps.version.outputs.version }}
          files: orca-flutter/dist/*.apk
          generate_release_notes: true
